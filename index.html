<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E9E2DA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Caderno de Receitas">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-r.png?v=3">
<link rel="icon" type="image/png" href="favicon-r.png?v=3">
<link rel="manifest" href="manifest.webmanifest?v=3">
<title>Caderno de Receitas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalnia:wght@300;400&family=Cormorant+Garamond:wght@500&family=Pinyon+Script&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: papel bege com relevo, tudo em vermelho; título dentro de uma moldura oval rendada; lista centralizada como um cardápio */
:root{
  --bg:#E9E2DA; --red:#8C1515; --soft:#A7655E; --line:rgba(140,21,21,.22); --hi:rgba(255,252,246,.85); --sh:rgba(95,70,55,.28);
  --display:"Kalnia","Didot","Bodoni 72",Georgia,serif;
  --name:"Cormorant Garamond",Garamond,Georgia,serif;
  --script:"Pinyon Script","Snell Roundhand",cursive;
  --type:"Courier Prime","Courier New",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);min-height:100%}
body{margin:0;color:var(--red);font-family:var(--type);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:url(papel.png);background-size:256px}
.panel{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.in{flex:1;padding:34px 30px 56px;padding-left:max(30px,env(safe-area-inset-left,0px));padding-right:max(30px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;text-align:center}
.in.centered{justify-content:center}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,.ing:focus-within{outline:1.5px solid var(--red);outline-offset:3px}
a{color:inherit}
.u{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* moldura oval em relevo */
.oval{position:relative;width:min(300px,80vw);aspect-ratio:320/380;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.oval svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.e1{fill:none;stroke:var(--hi);stroke-width:1.6;transform:translate(-.9px,-.9px)}
.e2{fill:none;stroke:var(--sh);stroke-width:1.2;transform:translate(.7px,.8px)}
.e1 ellipse+ellipse,.e2 ellipse+ellipse{stroke:none}
.e1 ellipse+ellipse{fill:var(--hi)} .e2 ellipse+ellipse{fill:var(--sh)}
.oval>*:not(svg){position:relative}
.kicker{font-family:var(--display);font-weight:400;font-size:clamp(22px,7vw,28px);letter-spacing:.06em;line-height:1;text-transform:uppercase;margin-top:6px}
.script{font-family:var(--script);font-size:clamp(58px,18vw,76px);line-height:1;margin:-6px 0 6px;padding:0 6px}
.spark{font-size:12px;line-height:1}
.newbtn{font-size:12.5px;margin-top:14px}

/* lista */
.list{width:100%;margin-top:26px;display:flex;flex-direction:column;align-items:center}
.item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px;width:100%}
.item+.item::before{content:"";display:block;width:26px;height:1px;background:var(--line);margin:-12px auto 12px}
.nm{font-family:var(--name);font-weight:500;font-size:22px;line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.sub{font-size:11px;color:var(--soft)}
.empty{padding:26px 8px;color:var(--soft)}
.out{margin-top:30px;font-size:11.5px;color:var(--soft)}

/* receita */
.topbar{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:12.5px}
.arch{width:150px;aspect-ratio:5/6;border-radius:999px 999px 6px 6px;overflow:hidden;margin-top:22px;outline:1px solid var(--red);outline-offset:4px}
.arch img{width:100%;height:100%;object-fit:cover;display:block}
h2{font-family:var(--name);font-weight:500;font-size:clamp(30px,9vw,38px);line-height:1.1;margin:22px 0 12px;text-wrap:balance;overflow-wrap:anywhere}
.video{font-size:12.5px;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.vlink{display:flex;gap:8px;align-items:center;width:100%;max-width:320px;margin:0 auto}
.vlink input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--red);background:transparent;border:0;border-bottom:1px dashed var(--soft);padding:6px 2px;border-radius:0}
.vlink input::placeholder{color:var(--soft)}
.vlink button{font-size:12.5px}
h4{font-family:var(--script);font-weight:400;font-size:38px;line-height:1;margin:34px 0 2px}
.count{font-size:11px;color:var(--soft);margin-bottom:10px;font-variant-numeric:tabular-nums}
.ings{list-style:none;margin:0;padding:0;width:100%;text-align:left}
.ing{display:flex;align-items:flex-start;gap:12px;padding:6px 0;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.ing input{position:absolute;opacity:0;pointer-events:none}
.cb{width:15px;height:15px;border:1px solid var(--red);flex:none;display:grid;place-items:center;margin-top:3px;transition:background .15s}
.cb svg{opacity:0}
.ing .tx{flex:1;min-width:0}
.ing b{font-weight:700}
.ing.on .tx{color:var(--soft);text-decoration:line-through}
.ing.on .cb{background:var(--red)}
.ing.on .cb svg{opacity:1}
.mini{margin-top:8px;font-size:11.5px;color:var(--soft)}
.steps{list-style:none;margin:6px 0 0;padding:0;width:100%;text-align:left;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:14px;align-items:baseline}
.steps i{font-family:var(--display);font-style:normal;font-size:20px;width:18px;flex:none;text-align:center;line-height:1}
.steps span{min-width:0}
.tip{margin-top:24px;width:100%;color:var(--soft);font-style:italic;font-size:12.5px}
.danger{margin-top:40px;display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--soft)}
.note{width:100%}
.btn{border:1px solid var(--red);border-radius:50%;padding:12px 26px;font-size:12.5px;color:var(--red)}
.btn.fill{background:var(--red);color:var(--bg)}

/* login */
.auth{width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px;margin-top:22px}
.msg{color:var(--soft);font-size:12px;margin:0}
.msg.err{color:var(--red)}

/* edição */
.fld{font:inherit;font-size:16px;color:var(--red);background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 2px;border-radius:0;width:100%;min-width:0}
.fld:focus{border-bottom-color:var(--red);outline:none}
.fld::placeholder{color:var(--soft)}
.fld.title{font-family:var(--name);font-weight:500;font-size:22px;text-align:center;border-bottom-color:var(--red)}
.label{font-size:11px;color:var(--soft);align-self:flex-start;margin-top:18px}
.photo-edit{display:flex;flex-direction:column;align-items:center;gap:12px;margin:4px 0 18px}
.photo-edit .arch{width:110px}
.ph-empty{width:110px;aspect-ratio:5/6;border-radius:999px 999px 6px 6px;border:1px dashed var(--soft);margin-top:22px}
.photo-btns{display:flex;gap:16px;font-size:12px}
.erow{display:flex;gap:8px;align-items:center;width:100%}
.erow .q{flex:0 0 38%}
.erow .n{flex:1}
.rm{width:30px;height:30px;flex:none;color:var(--soft);font-size:18px;line-height:1;display:grid;place-items:center}
.add{margin-top:12px;font-size:12.5px}
.actions{margin-top:36px;display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap}
.srow{align-items:flex-start}
.snum{font-family:var(--display);font-style:normal;font-size:20px;width:18px;flex:none;line-height:1;padding-top:10px;text-align:center}
textarea.fld{resize:none;overflow:hidden;line-height:1.4}
#fileIn{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>

const SUPABASE_URL="https://ufbmhikchqhstcbhioib.supabase.co";
const SUPABASE_KEY="sb_publishable_QGj4aoHhWZXbCUBep2tylA_a8NckDy7";

const $=id=>document.getElementById(id);
const $view=$("view");
let session=null, channel=null, recipes=[], current=null, confirmDel=false, loaded=false;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function renderList(){
  $view.classList.add("centered");
  let html=`<div class="oval">${OVAL}
      <div class="kicker">Caderno de</div><div class="script">receitas</div><div class="spark">✦</div>
      <button class="newbtn u" id="btnNew">+ nova receita</button>
    </div>`;
  if(recipes.length){
    html+=`<div class="list">${recipes.map(r=>{
      const n=(r.ingredientes||[]).length;

      <input type="checkbox" id="ing-${k}" data-n="${k}" ${i.checked?"checked":""}>
      <span class="cb">${tick}</span>
      <span class="tx">${i.qty?`<b>${esc(i.qty)}</b> `:""}${esc(i.name)}</span></label></li>`).join("")}</ul>
    ${done?'<button class="mini u" id="reset">desmarcar tudo</button>':""}
    <h4>modo de preparo</h4>
    <ol class="steps">${(r.passos||[]).map((s,k)=>`<li><i>${k+1}</i><span>${esc(s)}</span></li>`).join("")}</ol>
    ${r.dica?`<div class="tip">${esc(r.dica)}</div>`:""}
    <div class="danger">${confirmDel
      ?`<span class="note">Apagar essa receita pra sempre?</span><button class="u" id="no">cancelar</button><button class="u" id="yes" style="color:var(--red)">apagar</button>`
      :`<button class="u" id="del">apagar receita</button>`}</div>`;
  $("back").onclick=()=>{current=null;confirmDel=false;renderList();scrollTo(0,0)};
  $("edit").onclick=()=>startEdit(r);
  if($("vform"))$("vform").onsubmit=async e=>{e.preventDefault();
    const v=$("vIn").value.trim(); if(!safeUrl(v)){$("vIn").value="";$("vIn").placeholder="o link precisa começar com https://";return}
    r.video_url=v; cache(); renderRecipe();
    await saving; await sb.from("receitas").update({video_url:v,updated_at:new Date().toISOString()}).eq("id",r.id);
  };
  $view.querySelectorAll(".ing input").forEach(cb=>cb.onchange=()=>saveIngs(r,ings.map((i,k)=>k===+cb.dataset.n?{...i,checked:cb.checked}:{...i})));
  if($("reset"))$("reset").onclick=()=>saveIngs(r,ings.map(i=>({...i,checked:false})));
  if($("del"))$("del").onclick=()=>{confirmDel=true;renderRecipe()};
  if($("no"))$("no").onclick=()=>{confirmDel=false;renderRecipe()};
  if($("yes"))$("yes").onclick=async()=>{
    const {error}=await sb.from("receitas").delete().eq("id",r.id);
    if(!error){recipes=recipes.filter(x=>x.id!==r.id);cache();}
    current=null;confirmDel=false;renderList();
  };
}

/* ---------- edição (e receita nova) ---------- */
let draft=null;
function startEdit(r){
  draft=r?{id:r.id,titulo:r.titulo||"",foto:r.foto||"",video_url:r.video_url||"",ingredientes:(r.ingredientes||[]).map(i=>({...i})),passos:[...(r.passos||[])]}
         :{id:null,titulo:"",foto:"",video_url:"",ingredientes:[],passos:[]};
  if(!draft.ingredientes.length)draft.ingredientes.push({qty:"",name:"",checked:false});
  if(!draft.passos.length)draft.passos.push("");
  renderEdit();scrollTo(0,0);
}
function grow(t){t.style.height="auto";t.style.height=t.scrollHeight+"px"}
function renderEdit(msg){
  $view.classList.remove("centered");
  const d=draft;
  $view.innerHTML=`
    <div class="topbar"><button class="u" id="cancelTop">← cancelar</button><span>${d.id?"":"nova receita"}</span></div>
    <div class="photo-edit">${d.foto?arch(d.foto):'<span class="ph-empty"></span>'}
      <div class="photo-btns"><button class="u" id="pick">${d.foto?"trocar foto":"colocar foto"}</button>${d.foto?'<button class="u" id="nofoto" style="color:var(--soft)">remover</button>':""}</div>
      <input type="file" id="fileIn" accept="image/*">
    </div>
    <input class="fld title" id="eTitle" value="${esc(d.titulo)}" placeholder="nome da receita" aria-label="Nome da receita">
    <div class="label">link do vídeo</div>
    <input class="fld" id="eVideo" type="url" inputmode="url" value="${esc(d.video_url)}" placeholder="cole aqui o link (opcional)" aria-label="Link do vídeo">
    <h4>ingredientes</h4>
    <div style="width:100%;display:flex;flex-direction:column;gap:2px">${d.ingredientes.map((i,k)=>`
      <div class="erow">
        <input class="fld q" id="eq-${k}" data-k="${k}" data-f="qty" value="${esc(i.qty)}" placeholder="qtd." aria-label="Quantidade">
        <input class="fld n" id="en-${k}" data-k="${k}" data-f="name" value="${esc(i.name)}" placeholder="ingrediente" aria-label="Ingrediente">
        <button class="rm" data-rm="${k}" aria-label="Remover ingrediente">×</button>
      </div>`).join("")}</div>
    <button class="add u" id="addIng">+ ingrediente</button>
    <h4>modo de preparo</h4>
    <div style="width:100%;display:flex;flex-direction:column;gap:4px">${d.passos.map((p,k)=>`
      <div class="erow srow"><i class="snum">${k+1}</i>
        <textarea class="fld n" rows="1" id="es-${k}" data-s="${k}" placeholder="descreva o passo" aria-label="Passo ${k+1}">${esc(p)}</textarea>
        <button class="rm" data-rms="${k}" aria-label="Remover passo">×</button>
      </div>`).join("")}</div>
    <button class="add u" id="addStep">+ passo</button>
    ${msg?`<p class="msg err" style="margin-top:16px">${esc(msg)}</p>`:""}
    <div class="actions"><button class="u" id="cancel">cancelar</button><button class="btn fill" id="saveEdit">salvar</button></div>`;
  $("eVideo").oninput=e=>{d.video_url=e.target.value};
  $("eTitle").oninput=e=>{d.titulo=e.target.value};
  $view.querySelectorAll(".erow input.fld").forEach(inp=>inp.oninput=()=>{d.ingredientes[+inp.dataset.k][inp.dataset.f]=inp.value});
  $view.querySelectorAll("textarea[data-s]").forEach(t=>{grow(t);t.oninput=()=>{d.passos[+t.dataset.s]=t.value;grow(t)}});
  $view.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{d.ingredientes.splice(+b.dataset.rm,1);renderEdit()});
  $view.querySelectorAll("[data-rms]").forEach(b=>b.onclick=()=>{d.passos.splice(+b.dataset.rms,1);renderEdit()});
  $("addIng").onclick=()=>{d.ingredientes.push({qty:"",name:"",checked:false});renderEdit();$("eq-"+(d.ingredientes.length-1)).focus()};
  $("addStep").onclick=()=>{d.passos.push("");renderEdit();$("es-"+(d.passos.length-1)).focus()};
  $("pick").onclick=()=>$("fileIn").click();
  if($("nofoto"))$("nofoto").onclick=()=>{d.foto="";renderEdit()};
  $("fileIn").onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{d.foto=await shrink(f);renderEdit()}catch(err){renderEdit("Não consegui abrir essa foto. Tente outra.")}};
  $("cancel").onclick=$("cancelTop").onclick=()=>{const wasNew=!d.id;draft=null;if(wasNew){current=null;renderList()}else renderRecipe();scrollTo(0,0)};
  $("saveEdit").onclick=saveEdit;
}
// foto quadrada pequena (320 px), recortada no centro
function shrink(file){
  return new Promise((ok,fail)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(img.naturalWidth,img.naturalHeight),N=320,c=document.createElement("canvas");
      c.width=c.height=N;
      c.getContext("2d").drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,N,N);
      URL.revokeObjectURL(url);ok(c.toDataURL("image/jpeg",.82));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);fail()};
    img.src=url;
  });
}
async function saveEdit(){
  const d=draft, titulo=d.titulo.trim();
  if(!titulo)return renderEdit("Dê um nome pra receita.");
  const ingredientes=d.ingredientes.map(i=>({qty:(i.qty||"").trim(),name:(i.name||"").trim(),checked:!!i.checked})).filter(i=>i.qty||i.name);
  const passos=d.passos.map(p=>(p||"").trim()).filter(Boolean);
  const vu=(d.video_url||"").trim();
  if(vu&&!safeUrl(vu))return renderEdit("O link do vídeo precisa começar com https://");
  const body={titulo,foto:d.foto||null,video_url:vu||null,ingredientes,passos,updated_at:new Date().toISOString()};
  $("saveEdit").textContent="salvando…";
  await saving;
  if(d.id){
    const {error}=await sb.from("receitas").update(body).eq("id",d.id);
    if(error)return renderEdit("Não consegui salvar. Confira a internet e tente de novo.");
    const r=recipes.find(x=>x.id===d.id); if(r)Object.assign(r,body);
    current=d.id;
  } else {
    const {data,error}=await sb.from("receitas").insert(body).select().single();
    if(error||!data)return renderEdit("Não consegui salvar. Confira a internet e tente de novo.");
    recipes.unshift(data); current=data.id;
  }
  cache(); draft=null; renderRecipe(); scrollTo(0,0);
}

function open(id){current=id;confirmDel=false;draft=null;renderRecipe();scrollTo(0,0)}
function render(){ if(draft)return; current?renderRecipe():renderList()}
function cache(){try{localStorage.setItem("receitas-cache",JSON.stringify(recipes))}catch(e){}}

let saving=Promise.resolve();
function saveIngs(r,ingredientes){
  const local=recipes.find(x=>x.id===r.id); if(local) local.ingredientes=ingredientes;
  cache(); render();
  saving=saving.then(()=>sb.from("receitas").update({ingredientes,updated_at:new Date().toISOString()}).eq("id",r.id)).catch(()=>{});
}

async function load(){
  const {data,error}=await sb.from("receitas").select("*").order("criada_em",{ascending:false});
  if(error)return;
  loaded=true;
  // não sobrescrever um toque ainda não salvo
  await saving;
  recipes=data||[]; cache(); render();
}
let t=null; const loadSoon=()=>{clearTimeout(t);t=setTimeout(load,400)};

async function setSession(s){
  const changed=(s?.user?.id)!==(session?.user?.id); session=s;
  $("auth").hidden=!!session; $view.hidden=!session;
  if(!session){ if(channel){sb.removeChannel(channel);channel=null} recipes=[]; try{localStorage.removeItem("receitas-cache")}catch(e){} return; }
  render();
  if(changed){
    if(channel)sb.removeChannel(channel);
    channel=sb.channel("receitas-"+session.user.id).on("postgres_changes",{event:"*",schema:"public",table:"receitas",filter:"user_id=eq."+session.user.id},loadSoon).subscribe();
    load();
  }
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&session)load()});

function authMsg(t,err){$("authMsg").textContent=t;$("authMsg").classList.toggle("err",!!err)}
$("authForm").addEventListener("submit",async e=>{
  e.preventDefault(); authMsg("Entrando…");
  const {error}=await sb.auth.signInWithPassword({email:$("authEmail").value.trim(),password:$("authPass").value});
  if(error)authMsg("E-mail ou senha não conferem. Use os mesmos do Casa Nova.",true); else authMsg("");
});
sb.auth.onAuthStateChange((_ev,s)=>{setSession(s)});
sb.auth.getSession().then(({data})=>{ if(!data.session){$("auth").hidden=false} setSession(data.session) });
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
</script>
