<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F2E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Caderno de Receitas">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-r.png?v=2">
<link rel="icon" type="image/png" href="favicon-r.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=2">
<title>Caderno de Receitas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Jost:wght@300;400;500;600&family=Ephesis&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: papel creme de convite, flores tropicais pintadas nos cantos; uma coluna estreita centralizada */
:root{
  --red:#8E1B1B; --ink:#4A4340; --soft:#8A7F79; --paper:#F7F2E8; --line:rgba(142,27,27,.18); --err:#B4475A;
  --display:"Instrument Serif","Didot",Georgia,serif;
  --sans:"Jost","Avenir Next",system-ui,sans-serif;
  --script:"Ephesis","Snell Roundhand",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper);min-height:100%}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.45;font-weight:300;-webkit-font-smoothing:antialiased;
  background-image:url(papel.png);background-size:256px}
.panel{position:relative;max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.deco{position:absolute;inset:0;pointer-events:none;z-index:0}
.deco img{position:absolute;display:block;filter:drop-shadow(0 2px 3px rgba(80,40,20,.12))}
.in{flex:1;position:relative;z-index:1;padding:40px 30px 56px;padding-left:max(30px,env(safe-area-inset-left,0px));padding-right:max(30px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;text-align:center}
.in.centered{justify-content:center}
.in.page{padding-top:118px;padding-bottom:150px}
h1,h2{margin:0;font-weight:400;font-family:var(--display);color:var(--red);line-height:.95;text-wrap:balance;text-transform:uppercase;letter-spacing:.01em}
h1{font-size:clamp(46px,14vw,62px);transform:scaleY(1.12);margin:6px 0 18px}
h1 span{display:block}
.caps{font-weight:400;letter-spacing:.18em;font-size:11px;text-transform:uppercase;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,.ing:focus-within{outline:2px solid var(--red);outline-offset:3px}
.rule{display:flex;align-items:center;gap:10px;width:100%;color:var(--ink);font-weight:400;letter-spacing:.14em;font-size:11px;text-transform:uppercase}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:var(--red);box-shadow:0 4px 0 var(--red);transform:translateY(-2px)}
.rule b{font-family:var(--display);font-weight:400;color:var(--red);font-size:40px;letter-spacing:0;line-height:1}
.newbtn{letter-spacing:.14em;font-size:11px;text-transform:uppercase;font-weight:500;color:var(--red);padding:6px 4px}
.sig{font-family:var(--script);font-size:38px;color:var(--ink);margin-top:22px;line-height:1}

/* login */
.auth{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:18px}
.auth input{font:inherit;font-size:16px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--red);padding:10px 2px;border-radius:0;width:100%}
.auth input::placeholder{color:var(--soft)}
.msg{color:var(--soft);font-size:13px;margin:0}
.msg.err{color:var(--err)}

/* lista */
.list{width:100%;margin-top:18px;text-align:left}
.item{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.thumb{width:50px;height:50px;border-radius:50%;flex:none;border:1px solid var(--red);padding:2.5px;background:var(--paper);display:block}
.thumb img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.thumb img.fl{object-fit:contain;padding:4px}
.item .t{min-width:0;flex:1}
.nm{display:block;font-family:var(--display);font-size:20px;line-height:1.1;overflow-wrap:anywhere;color:var(--red)}
.sub{display:block;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-top:3px;font-weight:400}
.arrow{color:var(--red);font-size:19px;flex:none}
.empty{padding:30px 8px;color:var(--soft)}
.out{margin-top:26px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}

/* receita */
.back{align-self:flex-start;font-weight:600;letter-spacing:.18em;font-size:10.5px;color:var(--red);padding:4px 0;text-transform:uppercase}
.hero-photo{width:96px;height:96px;margin-top:10px}
h2{font-size:clamp(36px,11vw,46px);transform:scaleY(1.12);margin:14px 0 14px;overflow-wrap:anywhere}
.src{color:var(--red);font-weight:500;letter-spacing:.14em;font-size:10px;text-transform:uppercase;text-decoration:none;margin-top:8px}
h4{font-weight:600;letter-spacing:.16em;font-size:11.5px;text-transform:uppercase;width:100%;margin:24px 0 2px;color:var(--red)}
.count{font-size:11.5px;color:var(--soft);margin-bottom:6px;font-variant-numeric:tabular-nums}
.ings{list-style:none;margin:0;padding:0;width:100%;text-align:left}
.ing{display:flex;align-items:center;gap:11px;padding:5px 0;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.ing input{position:absolute;opacity:0;pointer-events:none}
.cb{width:18px;height:18px;border:1px solid var(--red);border-radius:50%;flex:none;display:grid;place-items:center;transition:background .15s}
.cb svg{opacity:0}
.ing .tx{flex:1;min-width:0}
.ing b{font-weight:500;color:var(--red)}
.ing.on .tx{color:var(--soft);text-decoration:line-through}
.ing.on b{color:var(--soft)}
.ing.on .cb{background:var(--red)}
.ing.on .cb svg{opacity:1}
.mini{margin-top:6px;font-size:11.5px;color:var(--soft);text-decoration:underline;text-underline-offset:3px}
.steps{list-style:none;margin:6px 0 0;padding:0;width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps i{font-family:var(--display);font-style:normal;font-size:26px;color:var(--red);width:18px;flex:none;line-height:.9;text-align:center}
.steps span{min-width:0}
.tip{margin-top:20px;width:100%;color:var(--soft);font-style:italic}
.danger{margin-top:28px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.btn{border:1px solid var(--red);color:var(--red);border-radius:99px;padding:9px 20px;font-weight:500;letter-spacing:.14em;font-size:10px;text-transform:uppercase;background:var(--paper)}
.btn.fill{background:var(--red);color:var(--paper)}
.note{color:var(--soft);font-size:13px;width:100%}

/* edição */
.topbar{display:flex;justify-content:space-between;align-items:center;width:100%}
.topbar .back{align-self:auto}
.edit-link{font-weight:600;letter-spacing:.18em;font-size:10.5px;color:var(--red);padding:4px 0;text-transform:uppercase}
.fld{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 2px;border-radius:0;width:100%;min-width:0}
.fld:focus{border-bottom-color:var(--red);outline:none}
.fld::placeholder{color:var(--soft)}
.fld.title{font-family:var(--display);font-size:24px;color:var(--red);text-align:center;border-bottom-color:var(--red)}
.photo-edit{display:flex;flex-direction:column;align-items:center;gap:8px;margin:16px 0 8px}
.photo-edit .thumb{width:96px;height:96px}
.photo-btns{display:flex;gap:16px}
.linkbtn{font-size:12px;color:var(--red);text-decoration:underline;text-underline-offset:3px}
.linkbtn.muted{color:var(--soft)}
.erow{display:flex;gap:8px;align-items:center;width:100%}
.erow .q{flex:0 0 40%}
.erow .fld{font-size:16px}
.erow .n{flex:1}
.rm{width:30px;height:30px;flex:none;color:var(--soft);font-size:18px;line-height:1;display:grid;place-items:center}
.rm:hover{color:var(--err)}
.add{margin-top:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--red)}
.actions{margin-top:30px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.srow{align-items:flex-start}
.snum{font-family:var(--display);font-style:normal;font-size:24px;color:var(--red);width:18px;flex:none;line-height:1;padding-top:8px;text-align:center}
textarea.fld{resize:none;overflow:hidden;line-height:1.35;font-size:16px}
#fileIn{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="panel">
  <div class="deco" id="deco" aria-hidden="true"></div>

  <div class="in centered" id="auth" hidden>
    <h1><span>Caderno de</span><span>Receitas</span></h1>
    <p class="msg">Entre com o mesmo e-mail e senha do Casa Nova.</p>
    <form class="auth" id="authForm" autocomplete="on">
      <input id="authEmail" type="email" placeholder="Seu e-mail" autocomplete="email" required aria-label="E-mail">
      <input id="authPass" type="password" placeholder="Senha" autocomplete="current-password" required aria-label="Senha">
      <button class="btn fill" type="submit" style="margin-top:10px;align-self:center">Entrar</button>
      <p class="msg" id="authMsg" role="status"></p>
    </form>
  </div>

  <div class="in" id="view" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL="https://ufbmhikchqhstcbhioib.supabase.co";
const SUPABASE_KEY="sb_publishable_QGj4aoHhWZXbCUBep2tylA_a8NckDy7";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const $view=$("view");
let session=null, channel=null, recipes=[], current=null, confirmDel=false, loaded=false;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tick='<svg width="11" height="11" viewBox="0 0 10 10"><path d="M2 5.2l2 2 4-4.4" stroke="#FBFAF6" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const FL=n=>`flores/${n}.png`;
const DECO={
  list:[["orquidea","left:-26px;top:calc(env(safe-area-inset-top,0px) - 18px);width:118px;transform:rotate(-12deg)"],
        ["buganvilia","right:-30px;top:calc(env(safe-area-inset-top,0px) + 6px);width:120px;transform:rotate(18deg) scaleX(-1)"],
        ["hibisco-laranja","left:-38px;bottom:calc(env(safe-area-inset-bottom,0px) - 30px);width:140px"],
        ["flor-branca","left:84px;bottom:calc(env(safe-area-inset-bottom,0px) - 26px);width:62px"],
        ["plumeria-amarela","right:-28px;bottom:calc(env(safe-area-inset-bottom,0px) - 24px);width:112px;transform:rotate(14deg)"],
        ["plumeria-rosa","right:78px;bottom:calc(env(safe-area-inset-bottom,0px) - 14px);width:70px;transform:rotate(-8deg)"]],
  page:[["plumeria-amarela","left:-28px;top:calc(env(safe-area-inset-top,0px) - 26px);width:96px"],
        ["hibisco-vermelho","right:-26px;top:calc(env(safe-area-inset-top,0px) - 22px);width:92px;transform:rotate(16deg)"],
        ["hibisco-laranja","left:-36px;bottom:calc(env(safe-area-inset-bottom,0px) - 30px);width:124px"],
        ["orquidea","right:-24px;bottom:calc(env(safe-area-inset-bottom,0px) - 20px);width:100px;transform:rotate(-10deg)"]]
};
let decoNow="";
function setDeco(kind){ if(decoNow===kind)return; decoNow=kind;
  $("deco").innerHTML=DECO[kind].map(([n,st])=>`<img src="${FL(n)}" alt="" style="${st}">`).join(""); }
const thumb=(r,cls="")=>`<span class="thumb ${cls}">${r.foto?`<img src="${esc(r.foto)}" alt="">`:`<img class="fl" src="${FL("flor-branca")}" alt="">`}</span>`;
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";

try{ const c=localStorage.getItem("receitas-cache"); if(c) recipes=JSON.parse(c)||[]; }catch(e){}

function renderList(){
  $view.classList.add("centered");$view.classList.remove("page");setDeco("list");
  let html=`<h1><span>Caderno de</span><span>Receitas</span></h1>
    <div class="rule"><button class="newbtn" id="btnNew">+ nova receita</button></div>`;
  if(recipes.length){
    html+=`<div class="list">${recipes.map(r=>{
      const n=(r.ingredientes||[]).length;
      const status=n?`${n} ingrediente${n>1?"s":""}`:"";
      return `<button class="item" data-id="${esc(r.id)}">${thumb(r)}
        <span class="t"><span class="nm">${esc(r.titulo)}</span>
        <span class="sub">${esc(status)}</span></span>
        <span class="arrow" aria-hidden="true">›</span></button>`}).join("")}</div>`;
  } else {
    html+=`<div class="empty">${loaded?"Nenhuma receita ainda.":"Abrindo o caderno…"}</div>`;
  }
  html+=`<div class="sig">bom apetite!</div><button class="out" id="btnLogout">sair</button>`;
  $view.innerHTML=html;
  $view.querySelectorAll(".item").forEach(b=>b.onclick=()=>open(b.dataset.id));
  $("btnLogout").onclick=async()=>{await sb.auth.signOut();setSession(null)};
  $("btnNew").onclick=()=>startEdit(null);
}

function renderRecipe(){
  $view.classList.remove("centered");$view.classList.add("page");setDeco("page");
  const r=recipes.find(x=>x.id===current);
  if(!r){current=null;return renderList();}
  const ings=r.ingredientes||[], done=ings.filter(i=>i.checked).length;
  const meta=[r.tempo,r.porcoes].filter(Boolean).map(esc).join(" · ");
  const url=safeUrl(r.video_url);
  $view.innerHTML=`
    <div class="topbar"><button class="back" id="back">‹ VOLTAR</button><button class="edit-link" id="edit">EDITAR</button></div>
    ${r.foto?thumb(r,"hero-photo"):""}
    <h2>${esc(r.titulo)}</h2>
    ${meta?`<div class="rule"><span>${meta}</span></div>`:""}${url?`<a class="src" href="${esc(url)}" target="_blank" rel="noopener">▶ ver vídeo original</a>`:""}
    <h4>Ingredientes</h4>
    ${ings.length?`<div class="count">${done} de ${ings.length} comprados</div>`:""}
    <ul class="ings">${ings.map((i,k)=>`<li><label class="ing ${i.checked?"on":""}">
      <input type="checkbox" id="ing-${k}" data-n="${k}" ${i.checked?"checked":""}>
      <span class="cb">${tick}</span>
      <span class="tx">${i.qty?`<b>${esc(i.qty)}</b> `:""}${esc(i.name)}</span></label></li>`).join("")}</ul>
    ${done?'<button class="mini" id="reset">desmarcar tudo</button>':""}
    <h4>Modo de preparo</h4>
    <ol class="steps">${(r.passos||[]).map((s,k)=>`<li><i>${k+1}</i><span>${esc(s)}</span></li>`).join("")}</ol>
    ${r.dica?`<div class="tip">${esc(r.dica)}</div>`:""}
    <div class="danger">${confirmDel
      ?`<span class="note">Apagar essa receita pra sempre?</span><button class="btn" id="no">cancelar</button><button class="btn fill" id="yes">apagar</button>`
      :`<button class="btn" id="del">apagar receita</button>`}</div>`;
  $("back").onclick=()=>{current=null;confirmDel=false;renderList();scrollTo(0,0)};
  $("edit").onclick=()=>startEdit(r);
  $view.querySelectorAll(".ing input").forEach(cb=>cb.onchange=()=>saveIngs(r,ings.map((i,k)=>k===+cb.dataset.n?{...i,checked:cb.checked}:{...i})));
  if($("reset"))$("reset").onclick=()=>saveIngs(r,ings.map(i=>({...i,checked:false})));
  if($("del"))$("del").onclick=()=>{confirmDel=true;renderRecipe()};
  if($("no"))$("no").onclick=()=>{confirmDel=false;renderRecipe()};
  if($("yes"))$("yes").onclick=async()=>{
    const {error}=await sb.from("receitas").delete().eq("id",r.id);
    if(!error){recipes=recipes.filter(x=>x.id!==r.id);cache();}
    current=null;confirmDel=false;renderList();
  };
}

/* ---------- edição (e receita nova) ---------- */
let draft=null;
function startEdit(r){
  draft=r?{id:r.id,titulo:r.titulo||"",foto:r.foto||"",ingredientes:(r.ingredientes||[]).map(i=>({...i})),passos:[...(r.passos||[])]}
         :{id:null,titulo:"",foto:"",ingredientes:[],passos:[]};
  if(!draft.ingredientes.length)draft.ingredientes.push({qty:"",name:"",checked:false});
  if(!draft.passos.length)draft.passos.push("");
  renderEdit();scrollTo(0,0);
}
function grow(t){t.style.height="auto";t.style.height=t.scrollHeight+"px"}
function renderEdit(msg){
  $view.classList.remove("centered");$view.classList.add("page");setDeco("page");
  const d=draft;
  $view.innerHTML=`
    <div class="topbar"><button class="back" id="cancelTop">‹ CANCELAR</button><span></span></div>
    ${d.id?"":'<div class="caps" style="margin-top:14px">Nova receita</div>'}
    <div class="photo-edit">${thumb({foto:d.foto})}
      <div class="photo-btns"><button class="linkbtn" id="pick">${d.foto?"trocar foto":"colocar foto"}</button>${d.foto?'<button class="linkbtn muted" id="nofoto">remover foto</button>':""}</div>
      <input type="file" id="fileIn" accept="image/*">
    </div>
    <input class="fld title" id="eTitle" value="${esc(d.titulo)}" placeholder="Nome da receita" aria-label="Nome da receita">
    <h4>Ingredientes</h4>
    <div style="width:100%;display:flex;flex-direction:column;gap:2px">${d.ingredientes.map((i,k)=>`
      <div class="erow">
        <input class="fld q" id="eq-${k}" data-k="${k}" data-f="qty" value="${esc(i.qty)}" placeholder="qtd." aria-label="Quantidade">
        <input class="fld n" id="en-${k}" data-k="${k}" data-f="name" value="${esc(i.name)}" placeholder="ingrediente" aria-label="Ingrediente">
        <button class="rm" data-rm="${k}" aria-label="Remover ingrediente">×</button>
      </div>`).join("")}</div>
    <button class="add" id="addIng">+ ingrediente</button>
    <h4>Modo de preparo</h4>
    <div style="width:100%;display:flex;flex-direction:column;gap:4px">${d.passos.map((p,k)=>`
      <div class="erow srow"><i class="snum">${k+1}</i>
        <textarea class="fld n" rows="1" id="es-${k}" data-s="${k}" placeholder="descreva o passo" aria-label="Passo ${k+1}">${esc(p)}</textarea>
        <button class="rm" data-rms="${k}" aria-label="Remover passo">×</button>
      </div>`).join("")}</div>
    <button class="add" id="addStep">+ passo</button>
    ${msg?`<p class="msg err" style="margin-top:14px">${esc(msg)}</p>`:""}
    <div class="actions"><button class="btn" id="cancel">cancelar</button><button class="btn fill" id="saveEdit">salvar</button></div>`;
  $("eTitle").oninput=e=>{d.titulo=e.target.value};
  $view.querySelectorAll(".erow input.fld").forEach(inp=>inp.oninput=()=>{d.ingredientes[+inp.dataset.k][inp.dataset.f]=inp.value});
  $view.querySelectorAll("textarea[data-s]").forEach(t=>{grow(t);t.oninput=()=>{d.passos[+t.dataset.s]=t.value;grow(t)}});
  $view.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{d.ingredientes.splice(+b.dataset.rm,1);renderEdit()});
  $view.querySelectorAll("[data-rms]").forEach(b=>b.onclick=()=>{d.passos.splice(+b.dataset.rms,1);renderEdit()});
  $("addIng").onclick=()=>{d.ingredientes.push({qty:"",name:"",checked:false});renderEdit();$("eq-"+(d.ingredientes.length-1)).focus()};
  $("addStep").onclick=()=>{d.passos.push("");renderEdit();$("es-"+(d.passos.length-1)).focus()};
  $("pick").onclick=()=>$("fileIn").click();
  if($("nofoto"))$("nofoto").onclick=()=>{d.foto="";renderEdit()};
  $("fileIn").onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{d.foto=await shrink(f);renderEdit()}catch(err){renderEdit("Não consegui abrir essa foto. Tente outra.")}};
  $("cancel").onclick=$("cancelTop").onclick=()=>{const wasNew=!d.id;draft=null;if(wasNew){current=null;renderList()}else renderRecipe();scrollTo(0,0)};
  $("saveEdit").onclick=saveEdit;
}
// foto quadrada pequena (320 px), recortada no centro
function shrink(file){
  return new Promise((ok,fail)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(img.naturalWidth,img.naturalHeight),N=320,c=document.createElement("canvas");
      c.width=c.height=N;
      c.getContext("2d").drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,N,N);
      URL.revokeObjectURL(url);ok(c.toDataURL("image/jpeg",.82));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);fail()};
    img.src=url;
  });
}
async function saveEdit(){
  const d=draft, titulo=d.titulo.trim();
  if(!titulo)return renderEdit("Dê um nome pra receita.");
  const ingredientes=d.ingredientes.map(i=>({qty:(i.qty||"").trim(),name:(i.name||"").trim(),checked:!!i.checked})).filter(i=>i.qty||i.name);
  const passos=d.passos.map(p=>(p||"").trim()).filter(Boolean);
  const body={titulo,foto:d.foto||null,ingredientes,passos,updated_at:new Date().toISOString()};
  $("saveEdit").textContent="salvando…";
  await saving;
  if(d.id){
    const {error}=await sb.from("receitas").update(body).eq("id",d.id);
    if(error)return renderEdit("Não consegui salvar. Confira a internet e tente de novo.");
    const r=recipes.find(x=>x.id===d.id); if(r)Object.assign(r,body);
    current=d.id;
  } else {
    const {data,error}=await sb.from("receitas").insert(body).select().single();
    if(error||!data)return renderEdit("Não consegui salvar. Confira a internet e tente de novo.");
    recipes.unshift(data); current=data.id;
  }
  cache(); draft=null; renderRecipe(); scrollTo(0,0);
}

function open(id){current=id;confirmDel=false;draft=null;renderRecipe();scrollTo(0,0)}
function render(){ if(draft)return; current?renderRecipe():renderList()}
function cache(){try{localStorage.setItem("receitas-cache",JSON.stringify(recipes))}catch(e){}}

let saving=Promise.resolve();
function saveIngs(r,ingredientes){
  const local=recipes.find(x=>x.id===r.id); if(local) local.ingredientes=ingredientes;
  cache(); render();
  saving=saving.then(()=>sb.from("receitas").update({ingredientes,updated_at:new Date().toISOString()}).eq("id",r.id)).catch(()=>{});
}

async function load(){
  const {data,error}=await sb.from("receitas").select("*").order("criada_em",{ascending:false});
  if(error)return;
  loaded=true;
  // não sobrescrever um toque ainda não salvo
  await saving;
  recipes=data||[]; cache(); render();
}
let t=null; const loadSoon=()=>{clearTimeout(t);t=setTimeout(load,400)};

async function setSession(s){
  const changed=(s?.user?.id)!==(session?.user?.id); session=s;
  $("auth").hidden=!!session; $view.hidden=!session;
  if(!session){ if(channel){sb.removeChannel(channel);channel=null} recipes=[]; try{localStorage.removeItem("receitas-cache")}catch(e){} return; }
  render();
  if(changed){
    if(channel)sb.removeChannel(channel);
    channel=sb.channel("receitas-"+session.user.id).on("postgres_changes",{event:"*",schema:"public",table:"receitas",filter:"user_id=eq."+session.user.id},loadSoon).subscribe();
    load();
  }
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&session)load()});

function authMsg(t,err){$("authMsg").textContent=t;$("authMsg").classList.toggle("err",!!err)}
$("authForm").addEventListener("submit",async e=>{
  e.preventDefault(); authMsg("Entrando…");
  const {error}=await sb.auth.signInWithPassword({email:$("authEmail").value.trim(),password:$("authPass").value});
  if(error)authMsg("E-mail ou senha não conferem. Use os mesmos do Casa Nova.",true); else authMsg("");
});
setDeco("list");
sb.auth.onAuthStateChange((_ev,s)=>{setSession(s)});
sb.auth.getSession().then(({data})=>{ if(!data.session){$("auth").hidden=false} setSession(data.session) });
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
</script>
